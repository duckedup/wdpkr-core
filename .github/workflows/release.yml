name: Release

# wdpkr-core is a library: a release is a crates.io publish plus a tag, with no
# binaries to build. Triggered by a version bump landing on main.
on:
  push:
    branches: [main]

# Serialized: a merge train pushes several bump commits minutes apart, and
# concurrent runs would race the tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check for version bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # `publish = false` in Cargo.toml holds the crate back while it is still a
      # stub (wdpkr-core-6fa.15 flips it). Checked here rather than letting
      # `cargo publish` refuse, so a held-back crate is a skipped release and not
      # a red run on every push to main.
      - name: Check if publishing is enabled
        id: enabled
        run: |
          if grep -qE '^publish\s*=\s*false' Cargo.toml; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cargo.toml sets publish = false — skipping release"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if tag exists
        id: check
        run: |
          TAG="v$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          if [ "${{ steps.enabled.outputs.enabled }}" != "true" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping release"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist, will release"
          fi

  publish-crate:
    name: Publish to crates.io
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-publish-

      - name: Publish
        run: |
          OUTPUT=$(cargo publish 2>&1) && exit 0
          if echo "$OUTPUT" | grep -q "already exists"; then
            echo "Version already published to crates.io, skipping"
          else
            echo "$OUTPUT"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: [check-version, publish-crate]
    if: "!failure() && !cancelled() && needs.check-version.outputs.should_release == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create tag
        run: |
          git tag ${{ needs.check-version.outputs.tag }}
          git push origin ${{ needs.check-version.outputs.tag }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${{ needs.check-version.outputs.tag }}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" HEAD)
          else
            NOTES=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD)
          fi

          gh release create "${{ needs.check-version.outputs.tag }}" \
            --title "${{ needs.check-version.outputs.tag }}" \
            --latest \
            --notes "## wdpkr-core ${{ needs.check-version.outputs.version }}

          \`\`\`toml
          [dependencies]
          wdpkr-core = \"${{ needs.check-version.outputs.version }}\"
          \`\`\`

          ### Changes

          $NOTES"
